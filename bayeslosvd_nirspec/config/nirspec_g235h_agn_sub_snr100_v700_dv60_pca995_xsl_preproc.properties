# BAYES-LOSVD preprocessing config for the Sombrero JWST/NIRSpec G235H
# AGN-subtracted cube, paper-style comparison setup with XSL templates.
# PCA dimensionality is selected automatically to preserve >=99.5% variance.

[sombrero_nirspec_g235h_agn_sub_snr100_v700_dv60_pca995_xsl]
filename     = "g235h_agn_sub.fits"
instrument   = "NIRSPEC-G235H"
redshift     = 0.003633
lmin         = 21000.0
lmax         = 23980.0
vmax         = 700.0
velscale     = 60.0
snr          = 100.0
snr_min      = 1.0
porder       = 6
template_lib = "XSL_NIRSPEC_G235H"
npca         = 0
pca_variance = 0.995
mask_file    = "nirspec_g235h_stellar.mask"
