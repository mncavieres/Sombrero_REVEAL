# BAYES-LOSVD preprocessing config for the Sombrero JWST/NIRSpec G235H
# AGN-subtracted cube.
#
# This file is staged into BAYES-LOSVD/config_files/ by
# scripts/stage_nirspec_bayeslosvd.py.

[sombrero_nirspec_g235h_agn_sub]
filename     = "g235h_agn_sub.fits"
instrument   = "NIRSPEC-G235H"
redshift     = 0.003633
lmin         = 21000.0
lmax         = 23980.0
vmax         = 700.0
velscale     = 50.0
snr          = 120.0
snr_min      = 10.0
porder       = 6
template_lib = "PHOENIX_NIRSPEC_G235H"
npca         = 8
mask_file    = "nirspec_g235h_stellar.mask"
